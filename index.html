<html lang="en" class="gr__w3schools_com">
<head>
  <title>Madl</title>
  <meta charset="UTF-8">
  <style>
    body,h1,h2,h3,h4,h5 {font-family: "Jost", "Raleway", sans-serif}
    .w3-third img{opacity: 0.8; cursor: pointer}
    .w3-third img:hover{opacity: 1}
  </style>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link href="newLogoLarge_cropped.png" rel="shortcut icon">

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#fff">
  <link rel="apple-touch-icon" href="/newLogoLarge_cropped.png"/>
  <link rel="apple-touch-startup-image" href="/newLogoLarge_cropped.png">

</head>
<body class="w3-light-grey" data-gr-c-s-loaded="true" onload="startTime()">
  <!-- Top menu on small screens -->
  <header class="w3-container w3-top w3-hide-large w3-white w3-xlarge w3-padding-16">
    <span class="w3-left w3-padding" style='font-family: "Jost", "Raleway", sans-serif'>MADL</span>
    <a href="javascript:void(0)" class="w3-right w3-button w3-white" onclick="w3_open()">☰</a>
  </header>

  <!-- Overlay effect when opening sidebar on small screens -->
  <div class="w3-overlay w3-hide-large w3-animate-opacity" onclick="w3_close()" style="cursor:pointer" title="close side menu" id="myOverlay"></div>

  <!-- !PAGE CONTENT! -->
  <div class="w3-main">

    <!-- Push down content on small screens --> 
    <div class="w3-hide-large" style="margin-top:83px"></div>

    <!-- Photo grid -->
    <div class="w3-row">
      <div class="w3-third">
        <img src="photos/page3/IMG_0498.JPG" style="width:100%" onclick="onClick(this)" alt="Dog">
        <img src="photos/page3/IMG_3616.jpg" style="width:100%" onclick="onClick(this)" alt="Forest River">
        <img src="photos/page3/IMG_4085.jpg" style="width:100%" onclick="onClick(this)" alt="English Cottage">
      </div>

      <div class="w3-third">
        <img src="photos/page3/IMG_3612.jpg" style="width:100%" onclick="onClick(this)" alt="English Lake District">
        <img src="photos/page3/IMG_3518.JPG" style="width:100%" onclick="onClick(this)" alt="Architecture">
        <img src="photos/page3/IMG_2135.JPG" style="width:100%" onclick="onClick(this)" alt="Dog">
      </div>

      <div class="w3-third">
        <img src="photos/page3/IMG_4850.jpg" style="width:100%" onclick="onClick(this)" alt="Hamburg Canals">
        <img src="photos/page3/IMG_3662.jpg" style="width:100%" onclick="onClick(this)" alt="Mountain Path">
        <img src="photos/page3/IMG_4678.jpg" style="width:100%" onclick="onClick(this)" alt="Tempodrom Berlin">
      </div>
    </div>

    <!-- Modal for full size images on click-->
    <div id="modal01" class="w3-modal w3-black" style="padding-top: 0px; display: none;" onclick="this.style.display='none'">
    <span class="w3-button w3-black w3-xlarge w3-display-topright">×</span>
    <div class="w3-modal-content w3-animate-zoom w3-center w3-transparent w3-padding-64">
      <img id="img01" class="w3-image" src="http://photos.cf/PhotoAccess1.JPG">
      <p style='font-family: "Jost", "Raleway", sans-serif' id="caption">Caption</p>
    </div>
  </div>

  <script>
    // Script to open and close sidebar
    function w3_open() {
      document.getElementById("mySidebar").style.display = "block";
      document.getElementById("myOverlay").style.display = "block";
    }

    function w3_close() {
      document.getElementById("mySidebar").style.display = "none";
      document.getElementById("myOverlay").style.display = "none";
    }

    // Modal Image Gallery
    function onClick(element) {
      document.getElementById("img01").src = element.src;
      document.getElementById("modal01").style.display = "block";
      var captionText = document.getElementById("caption");
      captionText.innerHTML = element.alt;
    }

    function startTime() {
  var today = new Date();
  var h = today.getHours();
  var m = today.getMinutes();
  var s = today.getSeconds();
  m = checkTime(m);
  s = checkTime(s);
  document.getElementById('txt').innerHTML =
  h + ":" + m + ":" + s;
  var t = setTimeout(startTime, 500);
}
function checkTime(i) {
  if (i < 10) {i = "0" + i};
  return i;
}

  </script>



</body>
</html>
