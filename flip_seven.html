<style>
  :root{
    --bg:#F6F3EC;
    --surface:#FFFFFF;
    --surface-2:#EFEAE0;
    --ink:#1B1917;
    --ink-dim:#7A7469;
    --line:#E1DACB;
    --gold:#C97F1E;
    --gold-soft:#F1DDB6;
    --teal:#186358;
    --teal-soft:#D7EAE5;
    --red:#B23A22;
    --red-soft:#F5DCD3;
    --shadow: 0 1px 2px rgba(27,25,23,.06), 0 8px 24px rgba(27,25,23,.06);
    color-scheme: light;
  }
  html.dark{
    --bg:#14181A;
    --surface:#1D2325;
    --surface-2:#242B2D;
    --ink:#EDEAE2;
    --ink-dim:#8E9795;
    --line:#303838;
    --gold:#E8A33D;
    --gold-soft:#3A2E16;
    --teal:#4FB6A5;
    --teal-soft:#173330;
    --red:#E2694E;
    --red-soft:#3A1E17;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .25s ease, color .25s ease;
    overscroll-behavior-y: none;
  }
  .num{ font-family:'Space Grotesk', 'Inter', sans-serif; }

  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    position:relative;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 20px 6px;
  }
  header h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:-0.01em;
    margin:0;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  header h1 .seven{
    color:var(--gold);
  }
  .icon-btn{
    width:40px; height:40px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--surface);
    display:flex; align-items:center; justify-content:center;
    color:var(--ink);
    cursor:pointer;
    transition: transform .15s ease, background .2s ease;
  }
  .icon-btn:active{ transform:scale(.92); }
  .icon-btn svg{ width:20px; height:20px; }

  .meta-strip{
    display:flex;
    align-items:center;
    gap:14px;
    padding:6px 20px 18px;
    color:var(--ink-dim);
    font-size:13px;
    font-weight:500;
  }
  .meta-strip b{
    color:var(--ink);
    font-weight:600;
  }
  .meta-dot{ width:3px; height:3px; border-radius:50%; background:var(--ink-dim); }

  /* ---------- Player list ---------- */
  #players{
    flex:1;
    padding: 4px 16px 140px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .player-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    padding:14px 16px;
    box-shadow:var(--shadow);
    position:relative;
    transition: border-color .2s ease;
  }
  .player-card.leader{
    border-color:var(--gold);
  }
  .player-card.winner{
    border-color:var(--gold);
    background: linear-gradient(180deg, var(--gold-soft), var(--surface) 70%);
  }

  .player-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .player-id{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
  }
  .rank-badge{
    width:26px; height:26px;
    border-radius:8px;
    background:var(--surface-2);
    color:var(--ink-dim);
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:13px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .rank-badge.gold{ background:var(--gold-soft); color:var(--gold); }

  .player-name{
    font-weight:600;
    font-size:16px;
    border:none;
    background:transparent;
    color:var(--ink);
    font-family:inherit;
    padding:2px 0;
    min-width:0;
    width:100%;
  }
  .player-name:focus{ outline:none; }

  .player-score{
    font-size:26px;
    font-weight:700;
    flex-shrink:0;
    font-variant-numeric: tabular-nums;
  }

  .player-controls{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:12px;
  }
  .stepper{
    display:flex;
    align-items:center;
    background:var(--surface-2);
    border-radius:12px;
    flex:1;
    overflow:hidden;
  }
  .stepper button{
    width:38px; height:38px;
    border:none;
    background:transparent;
    color:var(--ink);
    font-size:18px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    cursor:pointer;
  }
  .stepper button:active{ background:var(--line); }
  .stepper input{
    flex:1;
    min-width:0;
    text-align:center;
    border:none;
    background:transparent;
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:16px;
    -moz-appearance:textfield;
  }
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .stepper input:focus{ outline:none; }

  .quick-btn{
    height:38px;
    padding:0 12px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--surface);
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:13px;
    color:var(--ink-dim);
    cursor:pointer;
    white-space:nowrap;
    transition: all .15s ease;
  }
  .quick-btn:active{ transform:scale(.95); }
  .quick-btn.bust.active{
    background:var(--red-soft); color:var(--red); border-color:transparent;
  }
  .quick-btn.flip.active{
    background:var(--gold-soft); color:var(--gold); border-color:transparent;
  }

  .remove-player{
    position:absolute;
    top:-8px; right:-8px;
    width:24px; height:24px;
    border-radius:50%;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--ink-dim);
    display:none;
    align-items:center;
    justify-content:center;
    font-size:14px;
    cursor:pointer;
  }
  .edit-mode .remove-player{ display:flex; }

  /* ---------- Bottom action bar ---------- */
  .action-bar{
    position:fixed;
    bottom:0; left:0; right:0;
    max-width:480px;
    margin:0 auto;
    padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, transparent, var(--bg) 30%);
    display:flex;
    gap:10px;
  }
  .btn{
    border:none;
    border-radius:16px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    transition: transform .15s ease, opacity .15s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{
    flex:1;
    height:52px;
    background:var(--ink);
    color:var(--bg);
  }
  html.dark .btn-primary{ background:var(--gold); color:#14181A; }
  .btn-secondary{
    width:52px; height:52px;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  .btn-secondary svg{ width:20px; height:20px; }

  /* ---------- Sheet / overlay ---------- */
  .scrim{
    position:fixed; inset:0;
    background:rgba(20,24,26,.45);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    z-index:20;
  }
  .scrim.show{ opacity:1; pointer-events:auto; }

  .sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    max-width:480px;
    margin:0 auto;
    background:var(--surface);
    border-radius:24px 24px 0 0;
    padding:10px 20px calc(24px + env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform .3s cubic-bezier(.32,.72,0,1);
    z-index:21;
    max-height:88vh;
    overflow-y:auto;
    box-shadow: 0 -8px 30px rgba(0,0,0,.15);
  }
  .sheet.show{ transform:translateY(0); }
  .sheet-handle{
    width:36px; height:4px;
    background:var(--line);
    border-radius:2px;
    margin:8px auto 14px;
  }
  .sheet h2{
    font-family:'Space Grotesk', sans-serif;
    font-size:19px;
    margin:0 0 16px;
  }
  .field-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .field-row:last-of-type{ border-bottom:none; }
  .field-label{ font-size:15px; font-weight:500; }
  .field-sub{ font-size:12px; color:var(--ink-dim); margin-top:2px; }

  .segmented{
    display:flex;
    background:var(--surface-2);
    border-radius:10px;
    padding:3px;
    gap:2px;
  }
  .segmented button{
    border:none;
    background:transparent;
    padding:7px 12px;
    border-radius:8px;
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--ink-dim);
    cursor:pointer;
  }
  .segmented button.active{
    background:var(--surface);
    color:var(--ink);
    box-shadow:0 1px 3px rgba(0,0,0,.12);
  }

  .preset-row{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .preset-chip{
    border:1px solid var(--line);
    background:var(--surface-2);
    border-radius:10px;
    padding:8px 14px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:13px;
    color:var(--ink);
    cursor:pointer;
  }
  .preset-chip.active{ background:var(--gold-soft); color:var(--gold); border-color:transparent; }

  .name-edit-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
  }
  .name-edit-row input{
    flex:1;
    border:1px solid var(--line);
    background:var(--surface-2);
    border-radius:10px;
    padding:10px 12px;
    font-family:'Inter', sans-serif;
    font-size:14px;
    color:var(--ink);
  }
  .name-edit-row input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .name-edit-row button{
    width:32px; height:32px;
    border-radius:8px;
    border:none;
    background:var(--red-soft);
    color:var(--red);
    font-size:16px;
    cursor:pointer;
    flex-shrink:0;
  }

  .add-player-btn, .danger-btn{
    width:100%;
    border-radius:12px;
    border:1px dashed var(--line);
    background:transparent;
    padding:12px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14px;
    color:var(--ink-dim);
    cursor:pointer;
    margin-top:10px;
  }
  .danger-btn{
    border:1px solid var(--red-soft);
    color:var(--red);
    margin-top:20px;
  }

  /* ---------- Winner overlay ---------- */
  .winner-overlay{
    position:fixed; inset:0;
    background:rgba(20,24,26,.6);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:30;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
    padding:24px;
  }
  .winner-overlay.show{ opacity:1; pointer-events:auto; }
  .winner-card{
    background:var(--surface);
    border-radius:24px;
    padding:32px 28px;
    text-align:center;
    max-width:340px;
    width:100%;
    transform:scale(.92);
    transition:transform .3s cubic-bezier(.32,.72,0,1);
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .winner-overlay.show .winner-card{ transform:scale(1); }
  .winner-card .trophy{ font-size:42px; }
  .winner-card h2{
    font-family:'Space Grotesk', sans-serif;
    font-size:24px;
    margin:10px 0 4px;
  }
  .winner-card p{
    color:var(--ink-dim);
    font-size:14px;
    margin:0 0 22px;
  }
  .winner-card .btn-primary{ width:100%; }

  /* ---------- misc ---------- */
  .empty-hint{
    text-align:center;
    color:var(--ink-dim);
    font-size:13px;
    padding:20px 0 6px;
  }
  ::selection{ background:var(--gold-soft); }
  input:focus-visible, button:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>Flip<span class="seven">Seven</span></h1>
    <button class="icon-btn" id="openSettings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    </button>
  </header>

  <div class="meta-strip">
    <span>Target <b id="metaTarget">200</b></span>
    <span class="meta-dot"></span>
    <span>Round <b id="metaRound">1</b></span>
  </div>

  <div id="players"></div>

  <div class="action-bar">
    <button class="btn-secondary" id="resetRoundBtn" aria-label="Clear round entries">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
    <button class="btn btn-primary" id="submitRoundBtn">Submit round</button>
  </div>
</div>

<!-- Settings sheet -->
<div class="scrim" id="scrim"></div>
<div class="sheet" id="settingsSheet">
  <div class="sheet-handle"></div>
  <h2>Game setup</h2>

  <div class="field-row">
    <div>
      <div class="field-label">Appearance</div>
    </div>
    <div class="segmented" id="themeSeg">
      <button data-theme="light">Light</button>
      <button data-theme="dark">Dark</button>
      <button data-theme="auto">Auto</button>
    </div>
  </div>

  <div class="field-row" style="flex-direction:column; align-items:stretch;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div>
        <div class="field-label">Winning score</div>
        <div class="field-sub">First player to reach this wins</div>
      </div>
      <div class="stepper" style="max-width:130px;">
        <button id="targetMinus">–</button>
        <input id="targetInput" inputmode="numeric" value="200">
        <button id="targetPlus">+</button>
      </div>
    </div>
    <div class="preset-row" id="presetRow">
      <button class="preset-chip" data-preset="100">100</button>
      <button class="preset-chip" data-preset="150">150</button>
      <button class="preset-chip active" data-preset="200">200</button>
      <button class="preset-chip" data-preset="250">250</button>
      <button class="preset-chip" data-preset="300">300</button>
    </div>
  </div>

  <div class="field-row" style="flex-direction:column; align-items:stretch;">
    <div class="field-label" style="margin-bottom:6px;">Players</div>
    <div id="nameEditList"></div>
    <button class="add-player-btn" id="addPlayerBtn">+ Add player</button>
  </div>

  <button class="danger-btn" id="newGameBtn">Start new game</button>
</div>

<!-- Winner overlay -->
<div class="winner-overlay" id="winnerOverlay">
  <div class="winner-card">
    <div class="trophy">🏆</div>
    <h2 id="winnerName">Player wins</h2>
    <p id="winnerScore">Final score</p>
    <button class="btn btn-primary" id="playAgainBtn">Start new game</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "flip7-scores-v1";
  var DEFAULT_NAMES = ["Player 1","Player 2","Player 3","Player 4"];

  var state = loadState() || {
    target: 200,
    round: 1,
    theme: "auto",
    players: DEFAULT_NAMES.map(function(n, i){
      return { id: "p" + i + "-" + Date.now(), name: n, total: 0, roundInput: 0, bust: false, flip: false };
    }),
    winnerId: null
  };

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      return JSON.parse(raw);
    }catch(e){ return null; }
  }
  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  function uid(){ return "p" + Math.random().toString(36).slice(2,9) + Date.now().toString(36); }

  // ---------- Theme ----------
  function applyTheme(){
    var mode = state.theme;
    var isDark;
    if(mode === "auto"){
      isDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    } else {
      isDark = mode === "dark";
    }
    document.documentElement.classList.toggle("dark", isDark);
    var themeColor = isDark ? "#14181A" : "#F6F3EC";
    var meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute("content", themeColor);

    document.querySelectorAll("#themeSeg button").forEach(function(btn){
      btn.classList.toggle("active", btn.dataset.theme === mode);
    });
  }
  if(window.matchMedia){
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){
      if(state.theme === "auto") applyTheme();
    });
  }

  // ---------- Render ----------
  var playersEl = document.getElementById("players");
  var metaTarget = document.getElementById("metaTarget");
  var metaRound = document.getElementById("metaRound");

  function sortedPlayers(){
    return state.players.slice().sort(function(a,b){ return b.total - a.total; });
  }

  function render(){
    metaTarget.textContent = state.target;
    metaRound.textContent = state.round;

    var ordered = sortedPlayers();
    var topScore = ordered.length ? ordered[0].total : 0;
    var multipleLeaders = ordered.filter(function(p){ return p.total === topScore; }).length > 1;

    playersEl.innerHTML = "";
    ordered.forEach(function(p, idx){
      var card = document.createElement("div");
      card.className = "player-card";
      if(topScore > 0 && p.total === topScore && !multipleLeaders) card.classList.add("leader");

      var rankBadgeClass = (topScore > 0 && p.total === topScore && !multipleLeaders) ? "rank-badge gold" : "rank-badge";

      card.innerHTML =
        '<div class="player-top">' +
          '<div class="player-id">' +
            '<span class="' + rankBadgeClass + '">' + (idx+1) + '</span>' +
            '<input class="player-name" data-id="' + p.id + '" value="' + escapeAttr(p.name) + '" maxlength="18" aria-label="Player name">' +
          '</div>' +
          '<span class="player-score num" aria-label="Total score">' + p.total + '</span>' +
        '</div>' +
        '<div class="player-controls">' +
          '<div class="stepper">' +
            '<button class="step-minus" data-id="' + p.id + '" aria-label="Decrease round score">–</button>' +
            '<input class="round-input" data-id="' + p.id + '" inputmode="numeric" value="' + p.roundInput + '" aria-label="Round score">' +
            '<button class="step-plus" data-id="' + p.id + '" aria-label="Increase round score">+</button>' +
          '</div>' +
          '<button class="quick-btn bust' + (p.bust ? ' active' : '') + '" data-id="' + p.id + '">Bust</button>' +
          '<button class="quick-btn flip' + (p.flip ? ' active' : '') + '" data-id="' + p.id + '">Flip 7</button>' +
        '</div>';
      playersEl.appendChild(card);
    });

    if(ordered.length === 0){
      playersEl.innerHTML = '<div class="empty-hint">Add players in settings to start scoring.</div>';
    }

    renderNameEditList();
  }

  function escapeAttr(s){
    return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
  }

  // ---------- Player card interactions ----------
  playersEl.addEventListener("click", function(e){
    var t = e.target;
    var id = t.dataset.id;
    if(!id) return;
    var p = state.players.find(function(x){ return x.id === id; });
    if(!p) return;

    if(t.classList.contains("step-minus")){
      p.roundInput = Math.max(0, (parseInt(p.roundInput,10)||0) - 5);
      p.bust = false;
      render(); saveState();
    } else if(t.classList.contains("step-plus")){
      p.roundInput = (parseInt(p.roundInput,10)||0) + 5;
      p.bust = false;
      render(); saveState();
    } else if(t.classList.contains("bust")){
      p.bust = !p.bust;
      if(p.bust){ p.roundInput = 0; p.flip = false; }
      render(); saveState();
    } else if(t.classList.contains("flip")){
      p.flip = !p.flip;
      if(p.flip) p.bust = false;
      render(); saveState();
    }
  });

  playersEl.addEventListener("change", function(e){
    var t = e.target;
    var id = t.dataset.id;
    if(!id) return;
    var p = state.players.find(function(x){ return x.id === id; });
    if(!p) return;

    if(t.classList.contains("round-input")){
      var v = parseInt(t.value, 10);
      if(isNaN(v) || v < 0) v = 0;
      p.roundInput = v;
      if(v > 0) p.bust = false;
      saveState();
      render();
    } else if(t.classList.contains("player-name")){
      var name = t.value.trim();
      p.name = name || "Player";
      saveState();
      render();
    }
  });

  // ---------- Submit round ----------
  document.getElementById("submitRoundBtn").addEventListener("click", function(){
    state.players.forEach(function(p){
      if(p.bust){
        p.roundInput = 0;
      } else {
        var add = (parseInt(p.roundInput,10) || 0) + (p.flip ? 15 : 0);
        p.total += add;
      }
      p.roundInput = 0;
      p.bust = false;
      p.flip = false;
    });
    state.round += 1;
    saveState();
    render();
    checkWinner();
  });

  document.getElementById("resetRoundBtn").addEventListener("click", function(){
    state.players.forEach(function(p){ p.roundInput = 0; p.bust = false; p.flip = false; });
    saveState();
    render();
  });

  function checkWinner(){
    var winners = state.players.filter(function(p){ return p.total >= state.target; });
    if(winners.length){
      winners.sort(function(a,b){ return b.total - a.total; });
      var w = winners[0];
      document.getElementById("winnerName").textContent = w.name + " wins";
      document.getElementById("winnerScore").textContent = "Finished with " + w.total + " points";
      document.getElementById("winnerOverlay").classList.add("show");
    }
  }

  document.getElementById("playAgainBtn").addEventListener("click", function(){
    document.getElementById("winnerOverlay").classList.remove("show");
    startNewGame();
  });

  function startNewGame(){
    state.round = 1;
    state.players.forEach(function(p){ p.total = 0; p.roundInput = 0; p.bust = false; p.flip = false; });
    saveState();
    render();
  }

  // ---------- Settings sheet ----------
  var scrim = document.getElementById("scrim");
  var sheet = document.getElementById("settingsSheet");

  function openSheet(){
    scrim.classList.add("show");
    sheet.classList.add("show");
  }
  function closeSheet(){
    scrim.classList.remove("show");
    sheet.classList.remove("show");
  }
  document.getElementById("openSettings").addEventListener("click", openSheet);
  scrim.addEventListener("click", closeSheet);

  document.getElementById("themeSeg").addEventListener("click", function(e){
    var btn = e.target.closest("button[data-theme]");
    if(!btn) return;
    state.theme = btn.dataset.theme;
    saveState();
    applyTheme();
  });

  // Target score
  var targetInput = document.getElementById("targetInput");
  function setTarget(v){
    v = Math.max(10, Math.min(999, v));
    state.target = v;
    targetInput.value = v;
    document.querySelectorAll(".preset-chip").forEach(function(c){
      c.classList.toggle("active", parseInt(c.dataset.preset,10) === v);
    });
    saveState();
    render();
  }
  document.getElementById("targetMinus").addEventListener("click", function(){ setTarget((parseInt(targetInput.value,10)||0) - 25); });
  document.getElementById("targetPlus").addEventListener("click", function(){ setTarget((parseInt(targetInput.value,10)||0) + 25); });
  targetInput.addEventListener("change", function(){ setTarget(parseInt(targetInput.value,10) || 200); });
  document.getElementById("presetRow").addEventListener("click", function(e){
    var chip = e.target.closest(".preset-chip");
    if(!chip) return;
    setTarget(parseInt(chip.dataset.preset,10));
  });

  // Player name editing list inside sheet
  var nameEditList = document.getElementById("nameEditList");
  function renderNameEditList(){
    nameEditList.innerHTML = "";
    state.players.forEach(function(p){
      var row = document.createElement("div");
      row.className = "name-edit-row";
      row.innerHTML =
        '<input value="' + escapeAttr(p.name) + '" data-id="' + p.id + '" maxlength="18">' +
        '<button data-id="' + p.id + '" aria-label="Remove player">&times;</button>';
      nameEditList.appendChild(row);
    });
  }
  nameEditList.addEventListener("change", function(e){
    var t = e.target;
    if(t.tagName === "INPUT"){
      var p = state.players.find(function(x){ return x.id === t.dataset.id; });
      if(p){ p.name = t.value.trim() || "Player"; saveState(); render(); }
    }
  });
  nameEditList.addEventListener("click", function(e){
    var btn = e.target.closest("button[data-id]");
    if(!btn) return;
    if(state.players.length <= 2){
      alert("You need at least 2 players.");
      return;
    }
    state.players = state.players.filter(function(x){ return x.id !== btn.dataset.id; });
    saveState();
    render();
  });

  document.getElementById("addPlayerBtn").addEventListener("click", function(){
    if(state.players.length >= 8){
      alert("Maximum of 8 players.");
      return;
    }
    state.players.push({ id: uid(), name: "Player " + (state.players.length + 1), total: 0, roundInput: 0, bust:false, flip:false });
    saveState();
    render();
  });

  document.getElementById("newGameBtn").addEventListener("click", function(){
    if(confirm("Start a new game? This resets everyone's score to 0.")){
      closeSheet();
      startNewGame();
    }
  });

  // ---------- init ----------
  applyTheme();
  render();
})();
</script>
</body>
</html>
